<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHENZ Digital Solution | Device Registration</title>

  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"

    defer>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f7f4;
      font-family: Arial, sans-serif;
      color: #24352b;
    }

    .container {
      width: min(90%, 460px);
      padding: 32px;
      box-sizing: border-box;
      background: white;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);

      color: #176b43;
      font-size: 23px;
    }

    .message {
      color: #66736a;
      line-height: 1.6;
    }
  </style>

<body>
  <main class="container">
    <h1>RHENZ Digital Solution</h1>

    <h2>Case Manager Tool</h2>

    <p class="message">
      Secure Device Registration
    </p>

    <p class="message">
      Please complete the security verification to continue.
    </p>

    <div id="turnstile-container">
      <!-- Turnstile widget will be configured here. -->
    </div>

    <p id="status" class="message">
      Waiting for verification.
    </p>
